# A version tag (`v0.4.0`) checks that the repository is ready for that version,
# builds Claude Sessions for Windows, macOS and Linux, signs the updater bundles,
# writes the updater manifest (`latest.json`) and publishes everything as a
# GitHub Release — which is what installed apps read to offer the update.
#
# Nothing is published until every platform is built: the release stays a draft
# while files are uploaded, so the updater never reads a `latest.json` pointing
# at a bundle that isn't there yet. See docs/releasing.md.
#
# A manual run builds the current version and keeps the files as workflow
# artifacts, unsigned for the updater; it publishes nothing.

name: Release (Windows, macOS, Linux)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PRODUCT: Claude-Sessions

jobs:
  prepare:
    name: Check the release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # The version is committed (scripts/bump-version.mjs) rather than patched
      # in CI, so the app, its updater and local builds all report the same one.
      - name: Check that every manifest holds the version of the tag
        if: github.event_name == 'push'
        run: node scripts/bump-version.mjs --check "$GITHUB_REF_NAME"

      - name: Check that the manifests agree
        if: github.event_name != 'push'
        run: node scripts/bump-version.mjs --check

      - name: Check the updater key
        if: github.event_name == 'push'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if grep -q 'REPLACE_WITH_THE_UPDATER_PUBLIC_KEY' src-tauri/tauri.conf.json; then
            echo "::error file=src-tauri/tauri.conf.json::The updater public key is still a placeholder: see docs/releasing.md."
            exit 1
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is missing: see docs/releasing.md."
            exit 1
          fi

      - id: version
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

  build:
    name: Build (${{ matrix.os_label }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
            os_label: linux-x86_64
          - platform: ubuntu-22.04-arm
            args: ''
            os_label: linux-arm64
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            os_label: macOS-arm64
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            os_label: macOS-x64
          - platform: windows-latest
            args: ''
            os_label: win

    runs-on: ${{ matrix.platform }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      IS_RELEASE: ${{ github.event_name == 'push' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup mold linker (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        uses: rui314/setup-mold@v1

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          # xdg-utils fournit xdg-open, requis par le plugin GTK d'AppImage au
          # bundling. Présent sur l'image x86_64 mais absent de l'image arm64.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Release builds only: also produce the updater bundles, signed with the
      # updater key. Local and manual builds need no key.
      - name: Write the build configuration
        shell: bash
        run: |
          if [ "$IS_RELEASE" = true ]; then
            echo '{ "bundle": { "createUpdaterArtifacts": true } }' > src-tauri/tauri.release.conf.json
          else
            echo '{}' > src-tauri/tauri.release.conf.json
          fi

      - name: Build
        shell: bash
        timeout-minutes: 30
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # arm64 AppImage in CI: strip fails cross-arch and AppImage tooling
          # needs FUSE which the runner lacks — these two env vars are the fix.
          NO_STRIP: ${{ startsWith(matrix.platform, 'ubuntu') && 'true' || '' }}
          APPIMAGE_EXTRACT_AND_RUN: ${{ startsWith(matrix.platform, 'ubuntu') && '1' || '' }}
        run: |
          case "${{ matrix.os_label }}" in
            linux-*) bundles=appimage ;;
            # `app` makes the .app.tar.gz the macOS updater installs.
            macOS-*) bundles=app,dmg ;;
            win) bundles=nsis ;;
          esac
          pnpm tauri build --bundles "$bundles" --config src-tauri/tauri.release.conf.json ${{ matrix.args }}

      # The .sig of each updater bundle follows it under its new name: the
      # signature covers the file's bytes, not its name.
      - name: Collect & rename assets
        shell: bash
        run: |
          set -euo pipefail
          LABEL="${{ matrix.os_label }}"
          BASE="dist-release/${PRODUCT}-${VERSION}-${LABEL}"
          mkdir -p dist-release

          # Copy $1 to $2, and its .sig alongside when the build made one.
          take() {
            cp "$1" "$2"
            if [ -f "$1.sig" ]; then cp "$1.sig" "$2.sig"; fi
          }

          case "$LABEL" in
            linux-*)
              take "$(find src-tauri/target -path '*/release/bundle/appimage/*.AppImage' | head -n1)" "$BASE.AppImage"
              ;;
            macOS-*)
              cp "$(find src-tauri/target -path '*/release/bundle/dmg/*.dmg' | head -n1)" "$BASE.dmg"
              if [ "$IS_RELEASE" = true ]; then
                take "$(find src-tauri/target -path '*/release/bundle/macos/*.app.tar.gz' | head -n1)" "$BASE.app.tar.gz"
              fi
              ;;
            win)
              take "$(find src-tauri/target -path '*/release/bundle/nsis/*-setup.exe' | head -n1)" "$BASE-Setup.exe"
              cp "$(find src-tauri/target/release -maxdepth 1 -name 'claude-sessions.exe' | head -n1)" "$BASE-portable.exe"
              ;;
          esac

          if [ "$IS_RELEASE" = true ] && ! ls dist-release/*.sig >/dev/null 2>&1; then
            echo "::error::The build made no updater signature."
            exit 1
          fi
          echo "Assets:"; ls -lh dist-release

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os_label }}
          path: dist-release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the release
    needs: [prepare, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Write the updater manifest
        run: >-
          node scripts/updater-manifest.mjs release "$VERSION"
          "https://github.com/$GH_REPO/releases/download/$TAG"

      # The section for this version in CHANGELOG.md becomes the release body,
      # which GitHub renders above the assets.
      - name: Extract changelog section
        run: |
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { flag=1; next }
            flag && (/^## \[/ || /^\[[^]]+\]: /) { flag=0 }
            flag { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          # Strip leading/trailing blank lines.
          sed -i -e '/./,$!d' -e :a -e '/^\n*$/{$d;N;ba' -e '}' RELEASE_NOTES.md || true
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No changelog entry found for ${VERSION}. See CHANGELOG.md." > RELEASE_NOTES.md
          fi
          echo "----- release notes -----"; cat RELEASE_NOTES.md

      - name: Publish the release
        run: |
          # The signatures live in latest.json; users have no use for the .sig files.
          mapfile -t files < <(find release -type f ! -name '*.sig' | sort)
          if is_draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            # A draft left by an earlier run is completed. A published release is
            # never touched: installed apps may already have updated to it.
            if [ "$is_draft" != true ]; then
              echo "::error::The release $TAG is already published."
              exit 1
            fi
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            # A pre-release (v1.2.0-beta.1) is never the latest release, which
            # the updater reads, so installed apps are not offered it.
            prerelease=()
            if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
            gh release create "$TAG" "${files[@]}" --draft "${prerelease[@]}" \
              --title "$TAG" --notes-file RELEASE_NOTES.md --generate-notes
          fi
          gh release edit "$TAG" --draft=false
